name: Build installable plugin ZIP
on:
  push:
    branches: [main]
    paths:
      - 'plugin.py'
      - '_manifest.json'
      - 'README.md'
      - '.github/workflows/package.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python -m py_compile plugin.py
          python -c "import json; json.load(open('_manifest.json', encoding='utf-8'))"
      - name: Package plugin directory
        run: |
          mkdir -p dist/Maistatus_Plugin
          cp plugin.py _manifest.json README.md dist/Maistatus_Plugin/
          cd dist
          zip -r ../Maistatus_Plugin-v1.2.0.zip Maistatus_Plugin
      - uses: actions/upload-artifact@v4
        with:
          name: Maistatus_Plugin-v1.2.0
          path: Maistatus_Plugin-v1.2.0.zip
          if-no-files-found: error
          retention-days: 30
