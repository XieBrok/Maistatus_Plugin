name: Build installable plugin ZIP
on:
  push:
    branches: [main]
    paths:
      - 'plugin.py'
      - '_manifest.json'
      - 'README.md'
      - '.github/workflows/package.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python -m py_compile plugin.py
          python -c "import json; json.load(open('_manifest.json', encoding='utf-8'))"
      - name: Package plugin ZIP with manifest at root
        run: |
          mkdir -p dist
          cp plugin.py _manifest.json README.md dist/
          cd dist
          zip ../Maistatus_Plugin-v1.2.1.zip _manifest.json plugin.py README.md
          unzip -l ../Maistatus_Plugin-v1.2.1.zip
          unzip -Z1 ../Maistatus_Plugin-v1.2.1.zip | grep -qx '_manifest.json'
      - uses: actions/upload-artifact@v4
        with:
          name: Maistatus_Plugin-v1.2.1
          path: Maistatus_Plugin-v1.2.1.zip
          if-no-files-found: error
          retention-days: 30
