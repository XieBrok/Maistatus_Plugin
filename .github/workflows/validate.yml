name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile plugin.py
      - run: python -c "import json; json.load(open('_manifest.json', encoding='utf-8'))"
